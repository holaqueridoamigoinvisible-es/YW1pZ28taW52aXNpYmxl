spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

amigo:
  participants:
    file: file:participants.csv
  exclusions:
    file: file:exclusions.csv
  mail:
    from: ${MAIL_FROM}
    from-name: "Amigo invisible"

resend:
  api-key: ${RESEND_API_KEY}

server:
  port: ${PORT:8080}
