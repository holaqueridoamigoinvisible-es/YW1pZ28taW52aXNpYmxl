spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

amigo:
  participants:
    file: file:participants.csv
  exclusions:
    file: file:exclusions.csv
  mail:
    from: hola.querido.amigo.invisible@gmail.com
    from-name: "Amigo invisible"
  token:
    secret: ${TOKEN_SECRET:amigo-invisible-secret-key-padding}
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}

