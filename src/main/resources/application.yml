spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

amigo:
  participants:
    file: file:participants.csv
  exclusions:
    file: file:exclusions.csv
  mail:
    from: ${MAIL_USERNAME}
    from-name: "Amigo invisible"

mailjet:
  api-key: ${MAIL_USERNAME}
  secret-key: ${MAIL_PASSWORD}

server:
  port: ${PORT:8080}
