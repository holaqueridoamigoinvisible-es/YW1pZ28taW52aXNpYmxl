<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🎅 Amigo Invisible</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body   { background-color: #fdf6f0; }
    h1     { color: #c0392b; }
    h2     { color: #27ae60; }
    thead  { background-color: #27ae60; color: #fff; }
    .btn-sorteo { background-color: #c0392b; border-color: #c0392b; color: #fff; }
    .btn-sorteo:hover { background-color: #a93226; border-color: #a93226; color: #fff; }
    .email-suggestion { font-size: 0.85rem; color: #b7770d; margin-top: 3px; display: none; }
    .email-suggestion a { color: #b7770d; font-weight: 600; }
    .email-suggestion a:hover { opacity: 0.75; text-decoration: none; }
    .loading-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 9999;
      flex-direction: column; align-items: center; justify-content: center;
      color: #fff;
    }
    .loading-overlay.active { display: flex; }
  </style>
</head>
<body class="container py-4">
  <h1 class="mb-4 text-center">🎅 Amigo Invisible</h1>

  <div th:if="${error}" class="alert alert-danger fw-bold" th:text="${error}"></div>

  <form th:action="@{/draw}" th:object="${form}" method="post" novalidate>

    <!-- ── Loading overlay ── -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-border mb-3" style="width:3rem;height:3rem;" role="status"></div>
      <div class="fs-5 fw-semibold">🎅 Realizando el sorteo...</div>
      <div class="mt-1 small" style="color:rgba(255,255,255,0.7)">Enviando los emails, un momento</div>
    </div>

    <!-- ── Participants ── -->
    <h2 class="h4 mt-4">Participantes</h2>
    <table class="table table-bordered align-middle">
      <thead><tr><th>Nombre</th><th>Email</th></tr></thead>
      <tbody id="participantsBody">
        <tr th:each="entry, iStat : *{participants}">
          <td><input type="text" class="form-control"
                     th:field="*{participants[__${iStat.index}__].name}"
                     placeholder="Nombre"/></td>
          <td>
            <input type="email" class="form-control"
                   th:field="*{participants[__${iStat.index}__].email}"
                   placeholder="email@ejemplo.com"/>
            <div class="invalid-feedback">Introduce un email válido.</div>
            <div class="email-suggestion"></div>
          </td>
        </tr>
      </tbody>
    </table>
    <button type="button" class="btn btn-outline-success btn-sm mb-4"
            onclick="addParticipant()">+ Añadir participante</button>

    <!-- ── Exclusions ── -->
    <h2 class="h4 mt-2">Exclusiones <small class="text-muted fs-6 fw-normal">(X no regala a Y)</small></h2>
    <table class="table table-bordered align-middle">
      <thead><tr><th>Emisor (X)</th><th>Receptor (Y)</th></tr></thead>
      <tbody id="exclusionsBody">
        <tr th:each="excl, iStat : *{exclusions}">
          <td><input type="text" class="form-control"
                     th:field="*{exclusions[__${iStat.index}__].sender}"
                     placeholder="Nombre del emisor"/></td>
          <td><input type="text" class="form-control"
                     th:field="*{exclusions[__${iStat.index}__].receiver}"
                     placeholder="Nombre del receptor"/></td>
        </tr>
      </tbody>
    </table>
    <button type="button" class="btn btn-outline-secondary btn-sm mb-4"
            onclick="addExclusion()">+ Añadir exclusión</button>

    <!-- ── Submit ── -->
    <div class="d-grid mt-2">
      <button type="submit" class="btn btn-sorteo btn-lg">🎲 Realizar sorteo</button>
    </div>

  </form>

  <script src="https://cdn.jsdelivr.net/npm/mailcheck@1.1.2/src/mailcheck.min.js"></script>
  <script>
    // Initialise counters from server-rendered list sizes
    var pCount = /*[[${form.participants.size()}]]*/ 5;
    var eCount = /*[[${form.exclusions.size()}]]*/ 1;

    // ── Mailcheck: domain typo suggestions ──────────────────────────────────
    function attachMailcheck(input) {
      input.addEventListener('blur', function () {
        var val   = input.value.trim();
        var hint  = input.parentNode.querySelector('.email-suggestion');
        if (!hint) return;

        if (!val) { hint.style.display = 'none'; return; }

        Mailcheck.run({
          email: val,
          suggested: function (suggestion) {
            hint.innerHTML = '¿Quisiste decir <a href="#" class="suggestion-link">'
                           + suggestion.full + '</a>?';
            hint.style.display = '';
            hint.querySelector('.suggestion-link').addEventListener('click', function (e) {
              e.preventDefault();
              input.value = suggestion.full;
              hint.style.display = 'none';
              if (EMAIL_REGEX.test(suggestion.full)) {
                input.classList.remove('is-invalid');
              }
            });
          },
          empty: function () {
            hint.style.display = 'none';
          }
        });
      });

      // Hide suggestion while the user edits
      input.addEventListener('input', function () {
        var hint = input.parentNode.querySelector('.email-suggestion');
        if (hint) hint.style.display = 'none';
      });
    }

    function addParticipant() {
      var tbody = document.getElementById('participantsBody');
      var row = document.createElement('tr');
      row.innerHTML =
        '<td><input type="text" class="form-control" name="participants[' + pCount + '].name" placeholder="Nombre"/></td>' +
        '<td>' +
          '<input type="email" class="form-control" name="participants[' + pCount + '].email" placeholder="email@ejemplo.com"/>' +
          '<div class="invalid-feedback">Introduce un email válido.</div>' +
          '<div class="email-suggestion"></div>' +
        '</td>';
      tbody.appendChild(row);
      attachMailcheck(row.querySelector('input[type="email"]'));
      pCount++;
    }

    function addExclusion() {
      var tbody = document.getElementById('exclusionsBody');
      var row = document.createElement('tr');
      row.innerHTML =
        '<td><input type="text" class="form-control" name="exclusions[' + eCount + '].sender" placeholder="Nombre del emisor"/></td>' +
        '<td><input type="text" class="form-control" name="exclusions[' + eCount + '].receiver" placeholder="Nombre del receptor"/></td>';
      tbody.appendChild(row);
      eCount++;
    }

    // Client-side email validation on submit
    var EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    document.querySelector('form').addEventListener('submit', function (e) {
      var allValid = true;

      document.querySelectorAll('input[type="email"]').forEach(function (input) {
        // Reset previous state
        input.classList.remove('is-invalid');

        var value = input.value.trim();
        if (value !== '' && !EMAIL_REGEX.test(value)) {
          input.classList.add('is-invalid');
          allValid = false;
        }
      });

      if (!allValid) {
        e.preventDefault();
        // Scroll to first invalid field
        var first = document.querySelector('input.is-invalid');
        if (first) {
          first.scrollIntoView({ behavior: 'smooth', block: 'center' });
          first.focus();
        }
      } else {
        document.getElementById('loadingOverlay').classList.add('active');
      }
    });

    // Hide overlay if user navigates back (bfcache restore)
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) {
        document.getElementById('loadingOverlay').classList.remove('active');
      }
    });

    // Clear invalid state as user types
    document.addEventListener('input', function (e) {
      if (e.target && e.target.type === 'email') {
        if (EMAIL_REGEX.test(e.target.value.trim())) {
          e.target.classList.remove('is-invalid');
        }
      }
    });

    // Attach mailcheck to all server-rendered email inputs
    document.querySelectorAll('input[type="email"]').forEach(attachMailcheck);
  </script>
</body>
</html>
