<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🎁 Tu Amigo Invisible</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #fdf6f0; }
    h1   { color: #c0392b; }
    .receiver-card {
      border: 2px solid #27ae60;
      border-radius: 12px;
      padding: 2rem;
      background: #fff;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    .receiver-name { font-size: 3rem; font-weight: bold; color: #27ae60; }
  </style>
</head>
<body class="container py-5">

  <h1 class="mb-4 text-center">🎁 Tu Amigo Invisible</h1>

  <!-- ── Receiver card ── -->
  <div class="receiver-card shadow-sm">
    <div class="receiver-name" th:text="${receiverName}">Nombre</div>
    <p class="mt-2 mb-0 fs-5">¡Es la persona a la que tienes que regalar! 🎅</p>
  </div>

  <!-- ── Receiver wish list ── -->
  <div class="mt-4" style="max-width:500px;margin:0 auto;">
    <div th:if="${receiverWishes != null}" class="card">
      <div class="card-body">
        <h5 class="card-title">🎁 Lista de deseos de <span th:text="${receiverName}"></span></h5>
        <p class="card-text" th:text="${receiverWishes}"></p>
      </div>
    </div>
    <p th:if="${receiverWishes == null}" class="text-muted fst-italic">
      Aún no ha compartido su lista de deseos.
    </p>
  </div>

  <!-- ── Save confirmation alert ── -->
  <div th:if="${saved != null and saved}"
       class="alert alert-success mt-4"
       style="max-width:500px;margin:1.5rem auto 0;">
    ✅ ¡Tu lista de deseos ha sido guardada!
  </div>

  <!-- ── My wish list form ── -->
  <div class="mt-4" style="max-width:500px;margin:0 auto;">
    <h5>📝 Tu lista de deseos</h5>
    <p class="text-muted small">Cuéntale a tu amigo invisible qué regalos te gustarían.</p>
    <form th:action="@{/reveal/{t}/wishes(t=${token})}" method="post">
      <div class="mb-3">
        <textarea name="wishes"
                  rows="4"
                  class="form-control"
                  placeholder="Ej: Un libro de ciencia ficción, unos guantes azules..."
                  th:text="${myWishes != null ? myWishes : ''}"></textarea>
      </div>
      <button type="submit" class="btn btn-success">💾 Guardar lista de deseos</button>
    </form>
  </div>

  <div class="text-center mt-5">
    <a href="/" class="btn btn-outline-secondary">🏠 Inicio</a>
  </div>

</body>
</html>
