<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sorteo enviado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #fdf6f0; }
    h1   { color: #27ae60; }
    .card-done {
      border: 2px solid #27ae60;
      border-radius: 12px;
      padding: 2rem;
      background: #fff;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    .numero { font-size: 3rem; font-weight: bold; color: #27ae60; }
  </style>
</head>
<body class="container py-5">
  <h1 class="mb-4 text-center">✅ ¡Sorteo realizado!</h1>

  <!-- card-done -->
  <div class="card-done shadow-sm">
    <div class="numero" th:text="${sent != null ? sent : 0}">0</div>
    <p class="mt-2 mb-0 fs-5">Emails enviados correctamente.</p>
  </div>

  <div class="text-center mt-4">
    <a href="/" class="btn btn-success">🔄 Nuevo sorteo</a>
  </div>

  <p class="text-center text-muted small mt-1">
    ¿No has recibido tu email? Contacta con nosotros en
    <a th:href="'mailto:' + ${supportEmail} + '?subject=Sorteo+%23' + ${drawId}"
       th:text="${supportEmail}"></a> indicando el identificador del sorteo👉 <code th:text="'#' + ${drawId}">#—</code>
    <br/>
    ¿Te ha sido útil? <a href="https://ko-fi.com/secretsanta2025" target="_blank" rel="noopener">Invítanos a un café ☕</a>
  </p>
</body>
</html>
