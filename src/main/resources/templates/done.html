<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sorteo enviado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #fdf6f0; }
    h1   { color: #27ae60; }
    .card-done {
      border: 2px solid #27ae60;
      border-radius: 12px;
      padding: 2rem;
      background: #fff;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    .numero { font-size: 3rem; font-weight: bold; color: #27ae60; }
  </style>
</head>
<body class="container py-5">
  <h1 class="mb-4 text-center">✅ ¡Sorteo realizado!</h1>

  <div class="card-done shadow-sm">
    <div class="numero" th:text="${count}">0</div>
    <p class="mt-2 mb-3 fs-5">participantes recibirán su email en breve.</p>
    <p class="text-muted small">
      Los emails se están enviando en segundo plano.
      Revisa tu bandeja de entrada para confirmar que llegaron.
    </p>
  </div>

  <div class="text-center mt-4">
    <a href="/" class="btn btn-success">🔄 Nuevo sorteo</a>
  </div>
</body>
</html>
