<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🎉 Resultado del sorteo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body  { background-color: #fdf6f0; }
    h1    { color: #27ae60; }
    thead { background-color: #27ae60; color: #fff; }
  </style>
</head>
<body class="container py-4">
  <h1 class="mb-4 text-center">🎉 Resultado del sorteo</h1>

  <div class="alert alert-warning">
    ⚠️ Solo tú (el organizador) ves esto. Los emails aún no se han enviado.
  </div>

  <table class="table table-bordered table-striped align-middle">
    <thead>
      <tr><th>Emisor</th><th class="text-center">→</th><th>Receptor</th></tr>
    </thead>
    <tbody>
      <tr th:each="a : ${assignments}">
        <td th:text="${a.sender().name()}"></td>
        <td class="text-center text-muted">→</td>
        <td th:text="${a.receiver().name()}"></td>
      </tr>
    </tbody>
  </table>

  <form th:action="@{/send}" method="post" class="mt-3">
    <button type="submit" class="btn btn-success btn-lg">📧 Enviar emails a todos</button>
  </form>

  <a href="/" class="btn btn-link mt-3">← Volver a empezar</a>
</body>
</html>
