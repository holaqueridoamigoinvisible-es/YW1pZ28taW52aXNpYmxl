<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🎉 Sorteo listo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #fdf6f0; }
    h1   { color: #27ae60; }
    .card-sorteo {
      border: 2px solid #27ae60;
      border-radius: 12px;
      padding: 2rem;
      background: #fff;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    .numero { font-size: 3rem; font-weight: bold; color: #27ae60; }
  </style>
</head>
<body class="container py-5">
  <h1 class="mb-4 text-center">🎉 ¡Sorteo realizado!</h1>

  <div class="card-sorteo shadow-sm">
    <div class="numero" th:text="${count}">0</div>
    <p class="mt-2 mb-4 fs-5">participantes han sido asignados.</p>

    <p class="text-muted mb-4">
      Pulsa el botón para enviar a cada uno un email con el nombre
      de su amigo invisible. <strong>Los emails aún no se han enviado.</strong>
    </p>

    <form th:action="@{/send}" method="post">
      <button type="submit" class="btn btn-success btn-lg w-100">
        📧 Enviar emails a todos
      </button>
    </form>
  </div>

  <div class="text-center mt-4">
    <a href="/" class="btn btn-link">← Volver a empezar</a>
  </div>
</body>
</html>
